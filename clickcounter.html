<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Click Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF2F7; --ink:#1B2A41; --ink-soft:#4A5B72; --card:#FFFFFF;
    --line:#D4DDE8; --yellow:#C98A00; --yellow-soft:#FFF6DF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Nunito Sans',sans-serif;background:var(--paper);color:var(--ink);
    background-image:linear-gradient(var(--line) 1px, transparent 1px),
                     linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:28px 28px;min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 80px}
  h1{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.8rem;line-height:1.1}

  /* always-visible tip about ad blockers */
  .hint{
    background:var(--card);border:2px solid var(--line);border-radius:12px;
    padding:10px 14px;margin:12px 0 16px;color:var(--ink-soft);font-size:.92rem;line-height:1.4;
  }
  .hint strong{color:var(--ink)}

  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .total{color:var(--ink-soft);font-weight:700}
  .sort{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper)}
  .sort button{
    font-family:'Baloo 2',cursive;font-weight:700;font-size:.9rem;
    padding:6px 16px;border:none;background:transparent;color:var(--ink);cursor:pointer;
  }
  .sort button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .sort button:focus-visible{outline:3px solid var(--yellow);outline-offset:-3px}

  ul{
    list-style:none;background:var(--card);border:2px solid var(--ink);
    border-radius:14px;box-shadow:4px 4px 0 var(--ink);overflow:hidden;
  }
  li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
     padding:10px 18px;border-bottom:1px solid var(--line)}
  li:last-child{border-bottom:none}
  .name{font-weight:700}
  .num{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
  li.zero .name,li.zero .num{color:var(--ink-soft);font-weight:400}
  .note{color:var(--ink-soft);font-size:.85rem;margin-top:16px}
  .warn{
    background:var(--yellow-soft);border:2px solid var(--yellow);border-radius:12px;
    padding:12px 16px;margin-bottom:16px;font-weight:700;line-height:1.4;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Game Clicks</h1>

  <p class="hint" id="hint">
    <strong>Not seeing numbers?</strong> Turn off ad blockers (like uBlock Origin) for this page, then reload.
  </p>

  <div class="bar">
    <span class="total" id="total">Loading…</span>
    <div class="sort" role="group" aria-label="Sort order">
      <button id="sortClicks" type="button" aria-pressed="true">Most clicks</button>
      <button id="sortName" type="button" aria-pressed="false">A–Z</button>
    </div>
  </div>

  <div id="warn" class="warn" style="display:none"></div>
  <ul id="list"></ul>
  <p class="note">Counts can run up to a few hours behind.</p>
</div>

<script>
/* Same sheet the launcher reads, so any game added to the sheet shows up here
   automatically (it simply starts at 0 until someone clicks it). */
const SHEET_ID = "1OpRyLHrz9awYkUF-cMuaKpFZxfIv_DgPzwybEo8X98M";
const GC_CODE  = "stpmuskego";
const CONCURRENCY = 6;

/* MUST stay identical to clickPath() in index.html, or this page will look up
   the wrong label and show zeros. */
function clickPath(g){
  return "/click/" + String(g.name||"").trim().replace(/\//g,"-");
}

function parseGviz(text){
  return JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}")+1));
}

async function loadGames(){
  const res = await fetch(
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`
      + `?tqx=out:json&headers=1&sheet=Games&_=${Date.now()}`,
    { cache: "no-store" }
  );
  const json = parseGviz(await res.text());
  const cols = json.table.cols.map(c=>(c.label||"").toLowerCase().trim());
  const rows = json.table.rows.map(r=>{
    const o = {};
    cols.forEach((c,i)=>{ o[c] = r.c[i] ? String(r.c[i].v).trim() : ""; });
    return o;
  }).filter(g=>g.name && g.url);
  if(!rows.length) throw new Error("no rows");
  return rows;
}

/* GoatCounter's public counter: no password involved. A path that has never
   been clicked answers 404, which is a real zero. Anything else odd = null. */
async function getCount(path){
  const url = `https://${GC_CODE}.goatcounter.com/counter/${encodeURIComponent(path)}.json`;
  try{
    const res = await fetch(url);
    if(res.status === 404) return 0;
    if(!res.ok) return null;
    const j = await res.json();
    const n = parseInt(String(j.count).replace(/\D/g,""), 10);
    return Number.isNaN(n) ? null : n;
  }catch(e){ return null; }
}

async function mapLimit(items, limit, fn){
  const out = new Array(items.length);
  let next = 0;
  async function worker(){
    while(next < items.length){ const k = next++; out[k] = await fn(items[k], k); }
  }
  await Promise.all(Array.from({length: Math.min(limit, items.length)}, worker));
  return out;
}

function showWarn(msg){
  const w = document.getElementById("warn");
  w.textContent = msg; w.style.display = "block";
}

/* ---- display state ---- */
let rows = [];            // [{name, n}]  n = number, or null if it couldn't be read
let mode = "clicks";      // "clicks" = most clicks first, "name" = A–Z

function sortedRows(){
  const r = rows.slice();
  if(mode === "name") return r.sort((a,b)=>a.name.localeCompare(b.name));
  return r.sort((a,b)=>{
    if(a.n === null && b.n !== null) return 1;
    if(b.n === null && a.n !== null) return -1;
    if(a.n !== b.n) return (b.n||0) - (a.n||0);
    return a.name.localeCompare(b.name);
  });
}

function renderList(){
  const list = document.getElementById("list");
  list.innerHTML = "";
  sortedRows().forEach(r=>{
    const li = document.createElement("li");
    if(r.n === 0) li.className = "zero";
    const name = document.createElement("span");
    name.className = "name"; name.textContent = r.name;
    const num = document.createElement("span");
    num.className = "num"; num.textContent = r.n === null ? "\u2014" : r.n.toLocaleString();
    li.append(name, num);
    list.appendChild(li);
  });
}

function setMode(m){
  mode = m;
  document.getElementById("sortClicks").setAttribute("aria-pressed", m === "clicks");
  document.getElementById("sortName").setAttribute("aria-pressed", m === "name");
  renderList();
}
document.getElementById("sortClicks").addEventListener("click", ()=>setMode("clicks"));
document.getElementById("sortName").addEventListener("click", ()=>setMode("name"));

async function main(){
  const totalEl = document.getElementById("total");

  let games;
  try{ games = await loadGames(); }
  catch(e){
    totalEl.textContent = "";
    showWarn("Couldn't read the game list from the Google Sheet.");
    return;
  }

  /* one row per distinct name */
  const seen = new Set();
  games = games.filter(g=>{
    const k = g.name.trim().toLowerCase();
    if(seen.has(k)) return false; seen.add(k); return true;
  });

  const counts = await mapLimit(games, CONCURRENCY, g => getCount(clickPath(g)));
  rows = games.map((g,i)=>({name:g.name.trim(), n:counts[i]}));

  const failed = rows.filter(r=>r.n === null).length;
  const total  = rows.reduce((s,r)=>s + (r.n||0), 0);
  totalEl.textContent = failed === rows.length ? "" : `Total clicks: ${total.toLocaleString()}`;

  if(failed === rows.length){
    showWarn("No counts came through. Turn off your ad blocker for this page and reload. "
      + "If that doesn't help, check that \u201CAllow adding visitor counts on your website\u201D "
      + "is on in GoatCounter's settings.");
  }else if(failed){
    showWarn(`${failed} count${failed===1?"":"s"} couldn't be read and show as \u2014. Reload to retry.`);
  }

  renderList();
}

main();
</script>
</body>
</html>
